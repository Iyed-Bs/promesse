<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promesse · Scout Desk</title>
<meta name="description" content="Promesse's scouting desk: every match a player has played is a seat in his terrace.">
<link rel="icon" href="/static/promesse-p.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="/static/promesse-p-night.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/interaction.css">
<script>try { const t = JSON.parse(localStorage.getItem("kickoff")); if (t === "day" || t === "night") document.documentElement.dataset.theme = t;
  const dp = JSON.parse(localStorage.getItem("depth")); if (["glance", "scout", "expert"].includes(dp)) document.documentElement.dataset.depth = dp; } catch (e) {}</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-compare" viewBox="0 0 24 24"><path d="M7 20V9M12 20V4M17 20v-7M4 20h16"/></symbol>
  <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M3.5 7.5h17v3a1.8 1.8 0 0 0 0 3v3h-17v-3a1.8 1.8 0 0 0 0-3z"/><path d="M14.5 8v1.5M14.5 11.25v1.5M14.5 14.5V16"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</svg>
<div class="floodlights" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<header class="fascia">
  <a class="mark" href="#/discover" aria-label="Promesse Scout Desk, home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect class="p-tile" width="32" height="32" rx="6"/><rect class="p-ink" x="8.5" y="5" width="5.5" height="22" rx=".6"/><path class="p-ink" fill-rule="evenodd" d="M15.2 5H19a6.5 6.5 0 0 1 0 13h-3.8ZM15.2 8.4v6.2H19a3.1 3.1 0 0 0 0-6.2Z"/><circle cx="18.6" cy="11.5" r="1.5" fill="var(--crimson)"/></svg>
    <span class="wordmark">Promesse</span>
  </a>
  <nav class="stands" aria-label="Main">
    <a href="#/discover" data-nav="scout"><b>A</b>Scout</a>
    <a href="#/combinations" data-nav="game"><b>B</b>The game</a>
    <a href="#/method" data-nav="promesse"><b>C</b>Promesse</a>
  </nav>
  <div class="fascia-tools">
    <button class="drawer-btn" id="drawer-open" type="button" aria-expanded="false" aria-controls="drawer"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Desk</span></button>
    <button class="find" id="palette-open" type="button" aria-keyshortcuts="Control+K"><svg class="ico"><use href="#i-search"/></svg><span>Find a player</span><kbd>Ctrl K</kbd></button>
    <div class="kickoff depth" role="group" aria-label="Depth: how much the desk shows">
      <button type="button" data-depth="glance" aria-pressed="false" title="The essentials">Glance</button>
      <button type="button" data-depth="scout" aria-pressed="false" title="The reading, with its notes">Scout</button>
      <button type="button" data-depth="expert" aria-pressed="false" title="Every number behind it">Expert</button>
    </div>
    <div class="kickoff view" role="group" aria-label="View: Promesse, the 3D ground, or Promesse Light, the flat bowl">
      <button type="button" data-mode="promesse" aria-pressed="false" title="The Ground, a 3D model of the stadium (about 14 MB)">Promesse</button>
      <button type="button" data-mode="light" aria-pressed="false" title="The flat bowl: nothing to download, best performance">Light</button>
    </div>
    <div class="kickoff" role="group" aria-label="Light: daylight or floodlights">
      <button type="button" data-kick="day" aria-pressed="false" title="Daylight">15:00</button>
      <button type="button" data-kick="night" aria-pressed="false" title="Floodlights">20:45</button>
    </div>
  </div>
</header>
<nav class="subnav" id="subnav" aria-label="Pages in this section" hidden></nav>
<aside class="drawer" id="drawer" aria-label="Every page of the desk" hidden>
  <div class="drawer-panel"><!-- the desk's map, drawn by app.js from SECTIONS --></div>
</aside>
<main id="main" tabindex="-1"></main>
<footer class="foot">
  <span class="lineage"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 7.5c2.6 3.4 5.2 5.6 5.2 9.5a5.2 5.2 0 0 1-10.4 0c0-2.1 1-3.5 2.1-4.5.3 1.5.9 2.4 1.7 2.9C14 12 14.8 9.8 16 7.5Z" fill="var(--crimson)"/></svg>Promesse grows out of the Tactical Patcher (Summer 2026).</span>
  <span>Runs on this PC: the data never leaves it.</span>
  <span class="asof" id="asof"></span>
</footer>
<dialog id="palette" aria-label="Find a player or a board">
  <div class="pal-in"><svg class="ico"><use href="#i-search"/></svg><input id="palette-input" type="search" placeholder="A player, a club, a board" autocomplete="off" aria-label="Search" aria-controls="palette-results"></div>
  <ul id="palette-results" role="listbox" aria-label="Results"></ul>
  <div class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> to move</span><span><kbd>Enter</kbd> to open</span><span><kbd>Esc</kbd> to close</span></div>
</dialog>
<div class="tip" id="tip" role="tooltip"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/vendor/gsap.min.js"></script>
<script src="/static/app.js"></script>
<script src="/static/ui.js"></script>
<script src="/static/club.js"></script>
<script src="/static/scoreboard.js"></script>
<script src="/static/dives.js"></script>
<script src="/static/connect.js"></script>
</body>
</html>
